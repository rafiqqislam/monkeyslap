<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonkeySlap demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --card: #fffdf8;
        --ink: #2b1a10;
        --muted: #7a5a44;
        --line: #e6dccb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        background: rgba(244, 239, 230, 0.92);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font-size: 18px;
      }
      header p {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 10px 16px;
        border-radius: 12px;
        border: 2px solid var(--ink);
        background: #ffd43b;
        box-shadow: 3px 3px 0 var(--ink);
        cursor: pointer;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 16px;
        display: grid;
        gap: 16px;
      }
      .post {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }
      .post .who {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        font-weight: 700;
        font-size: 14px;
      }
      .post .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
      }
      .post .media {
        aspect-ratio: 4 / 3;
      }
      .post .caption {
        padding: 12px;
        font-size: 14px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Endless Feed (demo)</h1>
        <p>A pretend social feed for trying out the slap.</p>
      </div>
      <button id="slap" type="button">Slap me</button>
    </header>
    <main id="feed"></main>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
