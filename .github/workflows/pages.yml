# Publishes the site/ folder (homepage, privacy policy, support) to GitHub Pages
# whenever it changes on main. URL: https://rafiqqislam.github.io/monkeyslap/
#
# It skips publishing (without failing) while the pages still contain the
# [CONTACT EMAIL] placeholder.
name: Publish site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.placeholders.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: placeholders
        run: |
          if grep -rqn "\[CONTACT EMAIL\]" site; then
            echo "::notice::Not publishing yet: replace [CONTACT EMAIL] in site/ first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
